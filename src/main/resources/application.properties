# Server Port
server.port=8091

# Spring Data JPA and Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# PostgreSQL DataSource Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/tasks_db
spring.datasource.username=postgres
spring.datasource.password=miles
spring.datasource.driver-class-name=org.postgresql.Driver

# Eureka Client Configuration (if you're using Spring Cloud Eureka)
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

# Spring Boot Actuator (optional, for monitoring)
management.endpoints.web.exposure.include=*

# RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest # Default RabbitMQ username
spring.rabbitmq.password=guest # Default RabbitMQ password